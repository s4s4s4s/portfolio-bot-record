<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Universal Booking Bot  banner">
  <title>Universal Booking Bot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148,163,184,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#grid)"/>

  <!-- decorative orbits -->
  <g opacity="0.55" filter="url(#glow)">
    <circle cx="990" cy="240" r="160" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
    <circle cx="990" cy="240" r="110" fill="none" stroke="url(#accent)" stroke-width="1"/>
    <circle cx="990" cy="240" r="60"  fill="url(#accent)" opacity="0.18"/>
  </g>

  <!-- "phone" mock -->
  <g transform="translate(880,80)" filter="url(#glow)">
    <rect x="0" y="0" width="220" height="320" rx="34" ry="34" fill="#0b1224" stroke="#475569" stroke-width="2"/>
    <rect x="14" y="14" width="192" height="292" rx="22" ry="22" fill="#0f172a"/>
    <rect x="30" y="42" width="160" height="22" rx="6" fill="#1f2937"/>
    <rect x="30" y="76" width="160" height="22" rx="6" fill="#1f2937"/>
    <rect x="30" y="110" width="100" height="22" rx="6" fill="url(#accent)" opacity="0.85"/>
    <rect x="30" y="144" width="160" height="22" rx="6" fill="#1f2937"/>
    <rect x="30" y="178" width="160" height="22" rx="6" fill="#1f2937"/>
    <text x="110" y="276" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="16" fill="#94a3b8">70?8A0BLAO �</text>
  </g>

  <!-- main copy -->
  <g font-family="Inter, system-ui, sans-serif" fill="#e2e8f0">
    <text x="80" y="160" font-size="68" font-weight="700">
      Universal Booking Bot
    </text>
    <text x="80" y="216" font-size="26" font-weight="500" fill="#cbd5e1">
      70?8AL :;85=B>2 2 30 A5:C=4
    </text>
    <text x="80" y="252" font-size="22" fill="#94a3b8">
      aiogram 3.x � async SQLAlchemy 2.x � APScheduler
    </text>

    <!-- chips -->
    <g transform="translate(80,300)" font-size="18" fill="#0f172a" font-weight="600">
      <g>
        <rect x="0" y="0" width="170" height="44" rx="22" fill="#22d3ee"/>
        <text x="85" y="29" text-anchor="middle">FSM 7 H03>2</text>
      </g>
      <g transform="translate(186,0)">
        <rect x="0" y="0" width="200" height="44" rx="22" fill="#a78bfa"/>
        <text x="100" y="29" text-anchor="middle">0?><8=0=8O 24h/2h</text>
      </g>
      <g transform="translate(402,0)">
        <rect x="0" y="0" width="170" height="44" rx="22" fill="#34d399"/>
        <text x="85" y="29" text-anchor="middle">Admin-?0=5;L</text>
      </g>
      <g transform="translate(588,0)">
        <rect x="0" y="0" width="160" height="44" rx="22" fill="#fbbf24"/>
        <text x="80" y="29" text-anchor="middle">MIT � Docker</text>
      </g>
    </g>

    <text x="80" y="408" font-size="16" fill="#64748b">
      54 pytest passed � ruff clean � mypy --strict clean
    </text>
  </g>
</svg>
