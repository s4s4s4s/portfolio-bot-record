repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept in step with the "ruff>=0.15,<0.17" bound CI installs
    # (.github/workflows/ci.yml) — a stale local pin here is how new rules
    # (e.g. RUF022, RUF102) end up invisible in `pre-commit run` while CI still
    # enforces them. Bump both together.
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Kept in step with the "mypy>=2.1,<3" bound CI installs, for the same
    # reason as the ruff pin above.
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--strict]
        files: ^(bot|db|services|core|seeders)/
        additional_dependencies:
          - "pydantic>=2.9"
          - "pydantic-settings>=2.6"
          - "SQLAlchemy[asyncio]>=2.0"
          - "aiogram>=3.16"

  - repo: local
    hooks:
      - id: pytest-staged
        name: pytest (быстрые)
        entry: pytest tests/ -q --asyncio-mode=auto -m "not slow"
        language: system
        pass_filenames: false
        stages: [pre-commit]
